services:
  app:
    build:
      context: ../..
      dockerfile: apps/www/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production

  # --- Optional: automatic HTTPS via Caddy -------------------------------
